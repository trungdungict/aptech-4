# Aptech-4 local Prometheus scrape config (Compose profile `monitoring`).
# Scrapes only services on aptech4_net. Do not point this at public internet hosts.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

# DEMO SLI/SLO recording rules (see rules/aptech4_slo.yml and docs/MONITORING.md).
rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: aptech4-api
    metrics_path: /actuator/prometheus
    # API may be down when only deps+monitoring are up — keep scraping; targets show as down.
    scrape_interval: 15s
    static_configs:
      - targets: ["api:8080"]
        labels:
          service: api

  - job_name: postgres-exporter
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          service: postgres

  - job_name: redis-exporter
    static_configs:
      - targets: ["redis-exporter:9121"]
        labels:
          service: redis

  - job_name: cadvisor
    scrape_interval: 15s
    static_configs:
      - targets: ["cadvisor:8080"]
        labels:
          service: cadvisor
