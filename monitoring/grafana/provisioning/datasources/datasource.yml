apiVersion: 1

# Local Compose Grafana provisions Prometheus-Local only.
# Production Grafana should provision Prometheus-Production with the same UID
# pattern (see docs/MONITORING.md and datasource-production.example.yml).
# Do not expose Prometheus on a public interface.

datasources:
  - name: Prometheus-Local
    type: prometheus
    access: proxy
    uid: prometheus-local
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s
      httpMethod: POST
