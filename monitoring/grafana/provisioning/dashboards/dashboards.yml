apiVersion: 1

providers:
  - name: Aptech-4
    orgId: 1
    folder: Aptech-4
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    # Keep Git JSON as source of truth (UI edits are overwritten on provision sync).
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
