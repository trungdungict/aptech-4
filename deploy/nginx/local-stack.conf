# Local production-like stack: SPA + same-origin /api proxy to Spring Boot.
# Used by frontend/Dockerfile (Compose profile `stack`). EC2 overlays come in P15.

server {
	listen 80;
	server_name _;

	root /usr/share/nginx/html;
	index index.html;

	# Security / proxy headers
	proxy_http_version 1.1;
	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $scheme;

	# Spring API (container DNS name `api` on aptech4_net)
	location /api/ {
		proxy_pass http://api:8080/api/;
		proxy_connect_timeout 5s;
		proxy_read_timeout 60s;
		proxy_send_timeout 60s;
	}

	# STOMP over WebSocket (ADR-018) — same-origin via browser at /ws
	location /ws {
		proxy_pass http://api:8080/ws;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_read_timeout 3600s;
		proxy_send_timeout 3600s;
		proxy_connect_timeout 5s;
	}

	# SPA: deep links fall back to index.html
	location / {
		try_files $uri $uri/ /index.html;
	}
}

