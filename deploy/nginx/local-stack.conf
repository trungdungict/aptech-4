# Local production-like stack: SPA + same-origin /api proxy to Spring Boot.
# Used by frontend/Dockerfile (Compose profile `stack`). EC2 overlays come in P15.

server {
	listen 80;
	server_name _;

	root /usr/share/nginx/html;
	index index.html;

	# Security / proxy headers
	proxy_http_version 1.1;
	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $scheme;

	# Spring API (container DNS name `api` on aptech4_net)
	location /api/ {
		proxy_pass http://api:8080/api/;
		proxy_connect_timeout 5s;
		proxy_read_timeout 60s;
		proxy_send_timeout 60s;
	}

	# Uploaded product images (UUID paths under /uploads/products) — same-origin via nginx
	location /uploads/ {
		proxy_pass http://api:8080/uploads/;
		proxy_connect_timeout 5s;
		proxy_read_timeout 30s;
		proxy_send_timeout 30s;
		add_header X-Content-Type-Options nosniff always;
	}

	# AI chat SSE — disable buffering so deltas reach the browser promptly (ADR-019)
	location /api/v1/chat/ {
		proxy_pass http://api:8080/api/v1/chat/;
		proxy_http_version 1.1;
		proxy_set_header Connection "";
		proxy_buffering off;
		proxy_cache off;
		chunked_transfer_encoding on;
		proxy_connect_timeout 5s;
		proxy_read_timeout 3600s;
		proxy_send_timeout 3600s;
	}

	# STOMP over WebSocket (ADR-018) — same-origin via browser at /ws
	location /ws {
		proxy_pass http://api:8080/ws;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_read_timeout 3600s;
		proxy_send_timeout 3600s;
		proxy_connect_timeout 5s;
	}

	# Vite hashed build assets — MUST NOT fall back to index.html.
	# After redeploy, a stale tab may request an old chunk hash; returning HTML as
	# application/javascript causes "Failed to fetch dynamically imported module".
	location /assets/ {
		add_header Cache-Control "public, max-age=31536000, immutable" always;
		add_header X-Content-Type-Options nosniff always;
		try_files $uri =404;
	}

	# Entry HTML must revalidate so browsers pick up new chunk hashes after redeploy.
	location = /index.html {
		add_header Cache-Control "no-cache, no-store, must-revalidate" always;
		add_header Pragma "no-cache" always;
		add_header X-Content-Type-Options nosniff always;
	}

	# SPA deep links fall back to index.html (never for /assets/ — see above).
	location / {
		add_header Cache-Control "no-cache" always;
		try_files $uri $uri/ /index.html;
	}
}
