spring:
  application:
    name: aptech4-api
  servlet:
    multipart:
      # Keep aligned with PRODUCT_IMAGE_MAX_SIZE_BYTES (app still rejects size >= max).
      max-file-size: ${PRODUCT_IMAGE_MULTIPART_MAX:2MB}
      max-request-size: ${PRODUCT_IMAGE_MULTIPART_REQUEST_MAX:2MB}
  cache:
    type: redis
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:aptech4}
    username: ${POSTGRES_USER:aptech}
    password: ${POSTGRES_PASSWORD:aptech_dev_change_me}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
    web:
      pageable:
        # Documented for clients; ProductController validates explicitly (reject size > 100).
        default-page-size: 20
        max-page-size: 100
        one-indexed-parameters: false
  # Spring AI — chat model off unless APTECH_AI_ENABLED=true (see application-ai.yml / Compose profile ai).
  ai:
    model:
      chat: ${SPRING_AI_MODEL_CHAT:none}
      # Embedding unused by the assistant; keep off so Ollama embedding does not auto-enable.
      embedding: ${SPRING_AI_MODEL_EMBEDDING:none}
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        # Spring AI 2.0 binds model/temperature on spring.ai.ollama.chat.* (flat, not options.*).
        model: ${APTECH_AI_MODEL:llama3.2}
        temperature: 0.2

server:
  port: ${SERVER_PORT:8080}

# Security / JWT — secrets MUST come from environment (no weak defaults). See ADR-005.
aptech:
  security:
    jwt:
      issuer: ${JWT_ISSUER:aptech4-api}
      access-secret: ${JWT_ACCESS_SECRET}
      refresh-secret: ${JWT_REFRESH_SECRET}
      access-ttl-seconds: ${JWT_ACCESS_TTL_SECONDS:900}
      refresh-ttl-seconds: ${JWT_REFRESH_TTL_SECONDS:604800}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
      allow-credentials: true
  inventory:
    # Soft-hold TTL for ACTIVE reservations (ADR-006). Checkout (P06-T03) should confirm before expiry.
    reservation-ttl-seconds: ${INVENTORY_RESERVATION_TTL_SECONDS:900}
    expiry-poll-ms: ${INVENTORY_EXPIRY_POLL_MS:60000}
  cache:
    catalog:
      # Public category list/detail TTL (ADR-015).
      categories-ttl-seconds: ${CATALOG_CACHE_CATEGORIES_TTL_SECONDS:120}
      # Public product list/detail TTL (shorter: inStock changes via reservations).
      products-ttl-seconds: ${CATALOG_CACHE_PRODUCTS_TTL_SECONDS:60}
  payment:
    mock:
      # Deterministic mock outcome (SUCCEEDED|FAILED). Not a real payment gateway.
      default-outcome: ${MOCK_PAYMENT_DEFAULT_OUTCOME:SUCCEEDED}
      # When true, CheckoutRequest.simulateFailure is honored (tests/demo only).
      allow-client-force-failure: ${MOCK_PAYMENT_ALLOW_CLIENT_FORCE_FAILURE:false}
  ai:
    # Local Ollama assistant (ADR-019). Off by default so normal stack starts without a model.
    enabled: ${APTECH_AI_ENABLED:false}
    model: ${APTECH_AI_MODEL:llama3.2}
    request-timeout-seconds: ${APTECH_AI_TIMEOUT_SECONDS:90}
    max-history-messages: ${APTECH_AI_MAX_HISTORY:12}
    max-message-chars: ${APTECH_AI_MAX_MESSAGE_CHARS:2000}
    low-stock-threshold: ${APTECH_AI_LOW_STOCK_THRESHOLD:5}
    max-tool-results: ${APTECH_AI_MAX_TOOL_RESULTS:20}
  product-image:
    # Local filesystem storage for Admin uploads. PostgreSQL stores public path only.
    enabled: ${PRODUCT_IMAGE_UPLOAD_ENABLED:true}
    upload-dir: ${PRODUCT_IMAGE_UPLOAD_DIR:./.data/uploads/products}
    public-path: ${PRODUCT_IMAGE_PUBLIC_PATH:/uploads/products}
    # Strict: files with size >= max-size-bytes are rejected (exactly 2 MiB rejected by default).
    max-size-bytes: ${PRODUCT_IMAGE_MAX_SIZE_BYTES:2097152}
    allowed-types: ${PRODUCT_IMAGE_ALLOWED_TYPES:image/jpeg,image/png,image/webp}
    max-width: ${PRODUCT_IMAGE_MAX_WIDTH:6000}
    max-height: ${PRODUCT_IMAGE_MAX_HEIGHT:6000}
    max-pixels: ${PRODUCT_IMAGE_MAX_PIXELS:25000000}
    normalize-enabled: ${PRODUCT_IMAGE_NORMALIZE_ENABLED:false}
  seed:
    # Explicit one-shot only (make seed-demo / reset-demo). Never auto-run on normal API startup.
    enabled: ${APTECH_SEED_ENABLED:false}
    exit-after: ${APTECH_SEED_EXIT_AFTER:true}
    allow-on-prod: false
    reset: ${APTECH_SEED_RESET:false}
    reset-dry-run: ${APTECH_SEED_RESET_DRY_RUN:false}
    reset-confirm: ${APTECH_SEED_RESET_CONFIRM:}
    reseed-after-reset: ${APTECH_SEED_RESEED_AFTER_RESET:false}
    admin-email: ${DEMO_ADMIN_EMAIL:admin@aptech4.local}
    admin-password: ${DEMO_ADMIN_PASSWORD:}
    admin-full-name: Demo Admin
    customer-email: ${DEMO_CUSTOMER_EMAIL:customer@aptech4.local}
    customer-password: ${DEMO_CUSTOMER_PASSWORD:}
    customer-full-name: Demo Customer


management:
  endpoints:
    web:
      exposure:
        # prometheus is scraped on the Docker network / loopback API_PUBLISH only — not a public surface.
        # Do not expose env, beans, heapdump, threaddump, or configprops.
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
    prometheus:
      enabled: true
  metrics:
    tags:
      application: aptech4-api
    distribution:
      # Exponential histogram + explicit SLA/SLO boundaries (includes le="0.5" for DEMO latency SLI).
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 50ms,100ms,250ms,500ms,1s,2s,5s
      percentiles:
        http.server.requests: 0.5,0.95,0.99

# OpenAPI / Swagger (springdoc 3.2.0). Disable on production-like hosts via profile `prod`
# or env SPRINGDOC_SWAGGER_UI_ENABLED=false / SPRINGDOC_API_DOCS_ENABLED=false.
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:true}
  swagger-ui:
    path: /swagger-ui
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:true}
  show-actuator: false
  paths-to-match: /api/v1/**

logging:
  level:
    root: INFO
    com.aptech.aptech4: INFO

