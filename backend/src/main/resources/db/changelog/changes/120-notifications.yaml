databaseChangeLog:
  - changeSet:
      id: 120-notifications
      author: aptech4
      comment: Persistent in-app order notifications (recipient-scoped; dedupe per event)
      changes:
        - createTable:
            tableName: notifications
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: recipient_user_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: type
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: title
                  type: VARCHAR(200)
                  constraints:
                    nullable: false
              - column:
                  name: message
                  type: VARCHAR(1000)
                  constraints:
                    nullable: false
              - column:
                  name: order_id
                  type: UUID
              - column:
                  name: dedupe_key
                  type: VARCHAR(160)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: NOW()
                  constraints:
                    nullable: false
              - column:
                  name: read_at
                  type: TIMESTAMPTZ
        - addForeignKeyConstraint:
            baseTableName: notifications
            baseColumnNames: recipient_user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_notifications_recipient
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: notifications
            baseColumnNames: order_id
            referencedTableName: orders
            referencedColumnNames: id
            constraintName: fk_notifications_order
            onDelete: SET NULL
        - addUniqueConstraint:
            tableName: notifications
            columnNames: recipient_user_id, dedupe_key
            constraintName: uq_notifications_recipient_dedupe
        - createIndex:
            indexName: idx_notifications_recipient_created
            tableName: notifications
            columns:
              - column:
                  name: recipient_user_id
              - column:
                  name: created_at
                  descending: true
        - createIndex:
            indexName: idx_notifications_recipient_unread
            tableName: notifications
            columns:
              - column:
                  name: recipient_user_id
              - column:
                  name: read_at
        - sql:
            sql: >
              ALTER TABLE notifications
              ADD CONSTRAINT chk_notifications_type
              CHECK (type IN ('ORDER_PAID', 'ORDER_CANCELLED', 'ORDER_STATUS_CHANGED'));
