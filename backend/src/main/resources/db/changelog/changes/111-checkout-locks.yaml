databaseChangeLog:
  - changeSet:
      id: 111-checkout-locks
      author: aptech4
      comment: In-flight checkout mutex per user+idempotency key (rolls back with failed TX)
      changes:
        - createTable:
            tableName: checkout_locks
            columns:
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: idempotency_key
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: NOW()
                  constraints:
                    nullable: false
        - addPrimaryKey:
            tableName: checkout_locks
            columnNames: user_id, idempotency_key
            constraintName: pk_checkout_locks
        - addForeignKeyConstraint:
            baseTableName: checkout_locks
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_checkout_locks_user
            onDelete: CASCADE
