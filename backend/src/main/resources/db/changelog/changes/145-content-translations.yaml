databaseChangeLog:
  # P34-T03 — Entity-specific translation tables (vi|en). Base name columns remain the
  # canonical fallback; API resolution lands in T04; VI catalog dictionary + promo EN in T06.

  - changeSet:
      id: 145-product-translations
      author: aptech4
      comment: Per-locale product name/description (P34)
      changes:
        - createTable:
            tableName: product_translations
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: product_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: locale
                  type: VARCHAR(5)
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(200)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: TEXT
        - addForeignKeyConstraint:
            baseTableName: product_translations
            baseColumnNames: product_id
            referencedTableName: products
            referencedColumnNames: id
            constraintName: fk_product_translations_product
            onDelete: CASCADE
        - addUniqueConstraint:
            tableName: product_translations
            columnNames: product_id, locale
            constraintName: uq_product_translations_product_locale
        - createIndex:
            indexName: idx_product_translations_locale
            tableName: product_translations
            columns:
              - column:
                  name: locale
        - sql:
            sql: >
              ALTER TABLE product_translations
              ADD CONSTRAINT chk_product_translations_locale
              CHECK (locale IN ('vi', 'en'));
      rollback:
        - dropTable:
            tableName: product_translations

