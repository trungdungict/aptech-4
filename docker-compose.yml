# Aptech-4 local dependencies + optional production-like full stack.
# Copy `.env.example` → `.env` before `docker compose up`.
#
# Profiles:
#   (default)  postgres + redis only — `make up-deps`
#   stack      + api + web (nginx) — `make deploy-local`
#   ai         + ollama (local LLM) — `make up-ai` / `make deploy-local-ai`
#   monitoring Prometheus + Grafana + exporters — `make monitoring-up` (docs/MONITORING.md)
# Complete local demo (`make up-all`) enables stack + ai + monitoring together.
#
# Same-origin routing: browser → web:80 → /api/* → api:8080
# Postgres data: named volume aptech4_pgdata (never removed by Make stop targets).

name: aptech4

services:
  postgres:
    image: postgres:16-alpine
    container_name: aptech4-postgres
    restart: unless-stopped
    # IT suites open several Spring contexts; default 100 is tight with Compose API + Hikari.
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aptech4}
      POSTGRES_USER: ${POSTGRES_USER:-aptech}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aptech_dev_change_me}
    # Host publish for Maven/IT and `make seed-demo`. Loopback-friendly via POSTGRES_PORT.
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - aptech4_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aptech} -d ${POSTGRES_DB:-aptech4}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - aptech4_net

  redis:
    image: redis:7-alpine
    container_name: aptech4-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - aptech4_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - aptech4_net

  api:
    profiles: ["stack"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: aptech4-api:local
    container_name: aptech4-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # In-network hosts override .env localhost values used by host-side Maven.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      # Literal stack origins (do not interpolate CORS_ALLOWED_ORIGINS from .env).
      # Browser JSON POSTs from http://localhost:8088 send Origin; missing allow-list → 403 Invalid CORS request.
      # Host Vite still uses CORS_ALLOWED_ORIGINS from .env when running Spring on the host.
      CORS_ALLOWED_ORIGINS: "http://localhost:8088,http://127.0.0.1:8088,http://localhost:5173,http://localhost:3000"
      # Demo seed stays off unless an operator explicitly enables it (P14-T03 / make seed-demo).
      APTECH_SEED_ENABLED: ${APTECH_SEED_ENABLED:-false}
      # AI stays off unless Compose profile `ai` / make deploy-local-ai sets these.
      APTECH_AI_ENABLED: ${APTECH_AI_ENABLED:-false}
      APTECH_AI_MODEL: ${APTECH_AI_MODEL:-llama3.2}
      APTECH_AI_TIMEOUT_SECONDS: ${APTECH_AI_TIMEOUT_SECONDS:-90}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      SPRING_AI_MODEL_CHAT: ${SPRING_AI_MODEL_CHAT:-none}
    # Optional loopback publish for direct API debug (default off → empty).
    # Set API_PUBLISH=127.0.0.1:8080 to bind host loopback only.
    ports:
      - "${API_PUBLISH:-127.0.0.1:8080}:8080"
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
    networks:
      - aptech4_net
    extra_hosts:
      - "host.docker.internal:host-gateway"

  ollama:
    profiles: ["ai"]
    image: ollama/ollama:0.12.3
    container_name: aptech4-ollama
    restart: unless-stopped
    # Loopback only — do not publish Ollama on all interfaces.
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - aptech4_ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks:
      - aptech4_net

  web:
    profiles: ["stack"]
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # Baked at image build time. Path-absolute = same-origin (no localhost in prod bundle).
        VITE_API_BASE_URL: ${VITE_STACK_API_BASE_URL:-/api/v1}
    image: aptech4-web:local
    container_name: aptech4-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8088}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - aptech4_net

  # --- Optional monitoring (profile: monitoring) — loopback UI ports only ---
  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v2.55.1
    container_name: aptech4-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # 30d default so DEMO SLO rolling windows can accumulate (override via PROMETHEUS_RETENTION).
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - aptech4_prometheus:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - aptech4_net

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:11.3.1
    container_name: aptech4-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-aptech_grafana_change_me}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://127.0.0.1:3001}
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - aptech4_grafana:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - aptech4_net

  postgres-exporter:
    profiles: ["monitoring"]
    image: prometheuscommunity/postgres-exporter:v0.16.0
    container_name: aptech4-postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER:-aptech}:${POSTGRES_PASSWORD:-aptech_dev_change_me}@postgres:5432/${POSTGRES_DB:-aptech4}?sslmode=disable
    # No host ports — scraped only on aptech4_net.
    expose:
      - "9187"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - aptech4_net

  redis-exporter:
    profiles: ["monitoring"]
    image: oliver006/redis_exporter:v1.67.0
    container_name: aptech4-redis-exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://redis:6379
    expose:
      - "9121"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - aptech4_net

  cadvisor:
    profiles: ["monitoring"]
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: aptech4-cadvisor
    restart: unless-stopped
    # Required for container metrics. Privileged + docker.sock — local only; see docs/MONITORING.md.
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # No host ports — scraped only on aptech4_net.
    expose:
      - "8080"
    command:
      - --housekeeping_interval=30s
      - --docker_only=true
    networks:
      - aptech4_net

volumes:
  aptech4_pgdata:
    name: aptech4_pgdata
  aptech4_redisdata:
    name: aptech4_redisdata
  aptech4_ollama:
    name: aptech4_ollama
  aptech4_prometheus:
    name: aptech4_prometheus
  aptech4_grafana:
    name: aptech4_grafana

networks:
  aptech4_net:
    name: aptech4_net
